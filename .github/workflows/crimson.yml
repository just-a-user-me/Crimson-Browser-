name: Crimson build

on:
  push:
    branches:
      - crimson
  workflow_dispatch:

concurrency:
  group: crimson-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Android SDK licenses and platform
        run: |
          set +e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -3
          exit 0

      - name: Resolve latest compatible versions
        run: |
          set -e
          python3 - <<'PYEOF2'
          import json, os, re, urllib.request

          def get(url):
              return urllib.request.urlopen(url, timeout=90).read().decode()

          def versions(url):
              return re.findall(r"<version>([^<]+)</version>", get(url))

          def newest(vs, pattern):
              good = [v for v in vs if re.fullmatch(pattern, v)]
              return max(good, key=lambda v: tuple(int(x) for x in v.split(".")))

          G = "https://dl.google.com/dl/android/maven2/"
          M = "https://repo1.maven.org/maven2/"
          stable = r"\d+\.\d+\.\d+"
          props = {
              "geckoVersion": newest(versions("https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-arm64-v8a/maven-metadata.xml"), stable),
              "agpVersion": newest(versions(G + "com/android/tools/build/gradle/maven-metadata.xml"), r"9\.1\.\d+"),
              "kotlinVersion": newest(versions(M + "org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml"), stable),
              "composeBomVersion": newest(versions(G + "androidx/compose/compose-bom/maven-metadata.xml"), stable),
              "activityComposeVersion": newest(versions(G + "androidx/activity/activity-compose/maven-metadata.xml"), stable),
              "coreKtxVersion": newest(versions(G + "androidx/core/core-ktx/maven-metadata.xml"), stable),
              "webkitVersion": newest(versions(G + "androidx/webkit/webkit/maven-metadata.xml"), stable),
          }
          gradle = json.loads(get("https://services.gradle.org/versions/current"))["version"]
          with open("gradle.properties", "a") as f:
              for k, v in props.items():
                  f.write("%s=%s\n" % (k, v))
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("GRADLE_VERSION=%s\n" % gradle)
              env.write("GECKO_VERSION=%s\n" % props["geckoVersion"])
          with open("build.log", "a") as log:
              log.write("versions: %s gradle=%s\n" % (json.dumps(props), gradle))
          print(props, gradle)
          PYEOF2

      - name: Fetch the ad and tracker domain list
        run: |
          set -e
          mkdir -p app/src/main/assets
          curl -fsSL https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts -o app/src/main/assets/adhosts.txt
          wc -l app/src/main/assets/adhosts.txt

      - name: Fetch the developer panel library
        run: |
          set -e
          mkdir -p /tmp/eruda
          cd /tmp/eruda
          npm pack eruda@3.4.3 > /dev/null
          tar xzf eruda-*.tgz
          cp package/eruda.js "$GITHUB_WORKSPACE/app/src/main/assets/extensions/crimson/eruda.js"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee -a build.log

      - name: Sign APK
        run: |
          set -e
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          keytool -genkeypair -keystore ks.jks -alias crimson -keyalg RSA -keysize 2048 -validity 10000 -storepass crimson-temp -keypass crimson-temp -dname "CN=Crimson"
          mkdir -p signed
          for apk in app/build/outputs/apk/release/*.apk; do
            name=$(basename "$apk" | sed 's/-unsigned//')
            cp "$apk" "signed/$name"
            "$APKSIGNER" sign --ks ks.jks --ks-key-alias crimson --ks-pass pass:crimson-temp --key-pass pass:crimson-temp "signed/$name"
          done
          ls -alh signed

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: crimson-arm64
          path: signed/*.apk

      - name: Publish build log
        if: always()
        run: |
          set +e
          mkdir -p /tmp/logpub
          cd /tmp/logpub
          git init -q -b build-logs
          {
            echo "status: ${{ job.status }}"
            echo "run: ${GITHUB_RUN_ID}"
            echo "commit: ${GITHUB_SHA}"
            echo "gecko: ${GECKO_VERSION}"
          } > status.txt
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            tail -n 300 "$GITHUB_WORKSPACE/build.log" > tail.txt
            grep -nE "^e: |error:|FAILED|What went wrong|Could not|Unresolved|Execution failed" -A4 "$GITHUB_WORKSPACE/build.log" | head -200 > errors.txt
          fi
          git config user.name "crimson-ci"
          git config user.email "ci@crimson.invalid"
          git add -A
          git commit -qm "build log ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-logs
