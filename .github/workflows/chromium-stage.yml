name: Chromium build stage

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: number
    outputs:
      done:
        value: ${{ jobs.build.outputs.done }}

env:
  # Chromium commit and Bare patch series that match each other.
  CHROMIUM_COMMIT: 800628ad1ca1fd0c51e3b43b5b2bca081e81c3f6
  BARE_COMMIT: 9a20cee0014f49479764aaff05597f0fe3dd1e96
  STAGE: ${{ inputs.stage }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    outputs:
      done: ${{ steps.result.outputs.done }}
    steps:
      - name: Record start time
        run: echo "START=$(date +%s)" >> $GITHUB_ENV

      - name: Make room for the build
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          temp-reserve-mb: 1024
          swap-size-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout Crimson files
        uses: actions/checkout@v7

      - name: Show space and move caches to the big volume
        run: |
          df -h / $GITHUB_WORKSPACE || true
          free -h
          nproc
          mkdir -p $GITHUB_WORKSPACE/cache $GITHUB_WORKSPACE/tmp
          echo "XDG_CACHE_HOME=$GITHUB_WORKSPACE/cache" >> $GITHUB_ENV
          echo "CIPD_CACHE_DIR=$GITHUB_WORKSPACE/cache/cipd" >> $GITHUB_ENV
          echo "TMPDIR=$GITHUB_WORKSPACE/tmp" >> $GITHUB_ENV
          echo "VPYTHON_VIRTUALENV_ROOT=$GITHUB_WORKSPACE/cache/vpython" >> $GITHUB_ENV

      - name: Get depot_tools and the Bare patches
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          git clone https://github.com/BareBrowser/bare-browser.git bare
          git -C bare checkout "$BARE_COMMIT"
          cd depot_tools && ./ensure_bootstrap && cd ..
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

      - name: Fetch Chromium source
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          mkdir -p $GITHUB_WORKSPACE/chromium
          cd $GITHUB_WORKSPACE/chromium
          cat > .gclient <<'GCLIENT'
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          target_os = ["android"]
          GCLIENT
          git init -q src
          cd src
          git remote add origin https://chromium.googlesource.com/chromium/src.git
          git fetch --depth 1 origin "$CHROMIUM_COMMIT"
          git checkout -q FETCH_HEAD
          cd ..
          gclient sync --no-history --nohooks -D --force --reset -j8
          echo "source fetched"

      - name: Install build dependencies and run hooks
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          cd $GITHUB_WORKSPACE/chromium/src
          sudo ./build/install-build-deps.sh --android --no-prompt --no-chromeos-fonts
          gclient runhooks

      - name: Apply the patch series
        run: |
          set -e
          cd $GITHUB_WORKSPACE/chromium/src
          git config user.email "ci@crimson.invalid"
          git config user.name "crimson-ci"
          git apply --index $GITHUB_WORKSPACE/bare/patches/*.patch
          mkdir -p chrome/browser/resources/bare
          cp $GITHUB_WORKSPACE/bare/third_party/ublock_origin/uBlockOrigin-1.75.0.crx chrome/browser/resources/bare/ublock_origin.crx

      - name: Work out the previous stage
        run: echo "PREV=$(( STAGE - 1 ))" >> $GITHUB_ENV

      - name: Restore the previous stage
        if: ${{ inputs.stage > 1 }}
        uses: actions/download-artifact@v7
        with:
          name: out-stage-${{ env.PREV }}
          path: ${{ github.workspace }}/restore

      - name: Unpack the previous stage
        if: ${{ inputs.stage > 1 }}
        run: |
          set -e
          sudo apt-get install -y zstd > /dev/null
          mkdir -p $GITHUB_WORKSPACE/chromium/src/out
          zstd -d -T0 -c $GITHUB_WORKSPACE/restore/out.tar.zst | tar -C $GITHUB_WORKSPACE/chromium/src/out -xf -
          rm -rf $GITHUB_WORKSPACE/restore
          ls $GITHUB_WORKSPACE/chromium/src/out

      - name: Configure the build
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          cd $GITHUB_WORKSPACE/chromium/src
          mkdir -p out/Crimson
          cat > out/Crimson/args.gn <<'ARGS'
          target_os = "android"
          target_cpu = "arm64"
          is_desktop_android = true
          is_official_build = true
          is_debug = false
          is_java_debug = false
          is_component_build = false
          dcheck_always_on = false
          android_static_analysis = "off"
          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0
          use_remoteexec = false
          use_reclient = false
          proprietary_codecs = true
          ffmpeg_branding = "Chrome"
          use_mlkit_for_aicore = false
          enable_glic_internal_resources = false
          enable_reporting = false
          enable_service_discovery = false
          enable_mdns = false
          enable_arcore = false
          enable_cardboard = false
          enable_openxr = false
          disable_fieldtrial_testing_config = true
          use_thin_lto = false
          concurrent_links = 2
          chrome_public_manifest_package = "app.crimson.chromium"
          ARGS
          python3 $GITHUB_WORKSPACE/bare/tools/version.py gn arm64 | grep -v "chrome_public_manifest_package" >> out/Crimson/args.gn
          cat out/Crimson/args.gn | tail -4
          # Source files get an old timestamp so a restored build is not redone.
          find . -path ./out -prune -o \( -type f -o -type l \) -print0 | xargs -0 -P8 touch -h -c -d "2020-01-01 00:00:00" || true
          set -o pipefail
          gn gen out/Crimson 2>&1 | tee "$GITHUB_WORKSPACE/configure.log"

      - name: Build until time runs low
        id: ninja
        run: |
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          cd $GITHUB_WORKSPACE/chromium/src
          END=$(( START + 360*60 - 50*60 ))
          REMAIN=$(( END - $(date +%s) ))
          echo "Time for compiling: $((REMAIN/60)) minutes"
          set +e
          timeout --signal=INT "${REMAIN}s" autoninja -C out/Crimson chrome_public_apk 2>&1 | tee $GITHUB_WORKSPACE/ninja.log | tail -n 40
          RC=${PIPESTATUS[0]}
          echo "ninja exit code: $RC"
          echo "rc=$RC" >> $GITHUB_OUTPUT

      - name: Decide what happened
        id: result
        run: |
          RC="${{ steps.ninja.outputs.rc }}"
          if [ "$RC" = "0" ]; then
            echo "done=true" >> $GITHUB_OUTPUT
          elif [ "$RC" = "124" ] || [ "$RC" = "130" ] || [ "$RC" = "143" ]; then
            echo "done=false" >> $GITHUB_OUTPUT
          else
            echo "done=failed" >> $GITHUB_OUTPUT
            tail -n 120 $GITHUB_WORKSPACE/ninja.log
            exit 1
          fi

      - name: Pack this stage
        if: ${{ steps.result.outputs.done == 'false' }}
        run: |
          set -e
          sudo apt-get install -y zstd > /dev/null
          mkdir -p $GITHUB_WORKSPACE/pack
          tar -C $GITHUB_WORKSPACE/chromium/src/out -cf - Crimson | zstd -T0 -3 -o $GITHUB_WORKSPACE/pack/out.tar.zst
          ls -lh $GITHUB_WORKSPACE/pack

      - name: Save this stage
        if: ${{ steps.result.outputs.done == 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: out-stage-${{ inputs.stage }}
          path: ${{ github.workspace }}/pack/out.tar.zst
          compression-level: 0
          retention-days: 3

      - name: Sign the finished APK
        if: ${{ steps.result.outputs.done == 'true' }}
        run: |
          set -e
          cd $GITHUB_WORKSPACE/chromium/src
          APK=$(find out/Crimson/apks -name 'ChromePublic.apk' | head -n 1)
          ls -lh "$APK"
          APKSIGNER=$(find third_party/android_sdk/public/build-tools -name apksigner | sort -V | tail -n 1)
          keytool -genkeypair -keystore /tmp/ks.jks -alias crimson -keyalg RSA -keysize 2048 -validity 10000 -storepass crimson-temp -keypass crimson-temp -dname "CN=Crimson"
          mkdir -p $GITHUB_WORKSPACE/final
          cp "$APK" $GITHUB_WORKSPACE/final/Crimson-Chromium-arm64.apk
          "$APKSIGNER" sign --ks /tmp/ks.jks --ks-key-alias crimson --ks-pass pass:crimson-temp --key-pass pass:crimson-temp $GITHUB_WORKSPACE/final/Crimson-Chromium-arm64.apk

      - name: Save the finished APK
        if: ${{ steps.result.outputs.done == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: crimson-chromium-arm64
          path: ${{ github.workspace }}/final/Crimson-Chromium-arm64.apk
          compression-level: 0

      - name: Publish a short log
        if: always()
        run: |
          set +e
          mkdir -p /tmp/logpub && cd /tmp/logpub
          git init -q -b chromium-logs
          {
            echo "stage: ${STAGE}"
            echo "result: ${{ steps.result.outputs.done }}"
            echo "ninja rc: ${{ steps.ninja.outputs.rc }}"
            echo "run: ${GITHUB_RUN_ID}"
          } > status-stage-${STAGE}.txt
          [ -f $GITHUB_WORKSPACE/ninja.log ] && tail -n 150 $GITHUB_WORKSPACE/ninja.log > ninja-tail-stage-${STAGE}.txt
          [ -f $GITHUB_WORKSPACE/configure.log ] && tail -n 80 $GITHUB_WORKSPACE/configure.log > configure-stage-${STAGE}.txt
          git config user.name "crimson-ci"; git config user.email "ci@crimson.invalid"
          git add -A; git commit -qm "chromium stage ${STAGE}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" chromium-logs
