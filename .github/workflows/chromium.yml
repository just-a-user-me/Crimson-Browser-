name: Crimson Chromium

on:
  workflow_dispatch:
  push:
    branches:
      - chromium

concurrency:
  group: chromium-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stage1:
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: 1
    secrets: inherit
  stage2:
    needs: stage1
    if: ${{ needs.stage1.outputs.done == 'false' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: 2
    secrets: inherit
  stage3:
    needs: stage2
    if: ${{ needs.stage2.outputs.done == 'false' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: 3
    secrets: inherit
  stage4:
    needs: stage3
    if: ${{ needs.stage3.outputs.done == 'false' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: 4
    secrets: inherit
  stage5:
    needs: stage4
    if: ${{ needs.stage4.outputs.done == 'false' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: 5
    secrets: inherit
  stage6:
    needs: stage5
    if: ${{ needs.stage5.outputs.done == 'false' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: 6
    secrets: inherit
  stage7:
    needs: stage6
    if: ${{ needs.stage6.outputs.done == 'false' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: 7
    secrets: inherit
  stage8:
    needs: stage7
    if: ${{ needs.stage7.outputs.done == 'false' }}
    uses: ./.github/workflows/chromium-stage.yml
    with:
      stage: 8
    secrets: inherit
